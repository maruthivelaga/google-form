server {
    listen 80;
    server_name _;

    # Redirect bare root to /data-form/
    location = / {
        return 301 /data-form/;
    }

    # Proxy API requests to backend (strip /data-form prefix)
    location /data-form/api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Serve static frontend files at /data-form/
    location /data-form/ {
        alias /usr/share/nginx/html/data-form/;
        try_files $uri $uri/ /data-form/index.html;
    }

    # Fallback: serve index.html for all unmatched /data-form/* routes (SPA routing)
    location ~ ^/data-form(/.*)?$ {
        alias /usr/share/nginx/html/data-form/;
        try_files $uri /data-form/index.html;
    }
}
