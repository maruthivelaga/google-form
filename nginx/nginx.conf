server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirect bare root to /data-form/
    location = / {
        return 301 /data-form/;
    }

    # Redirect bare admin URL to /data-form/ravikishoretp
    location = /ravikishoretp {
        return 301 /data-form/ravikishoretp;
    }

    # Proxy API requests when accessed via /data-form/praveentp/
    location /data-form/praveentp/ {
        proxy_pass http://backend:5000/praveentp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy API requests when accessed directly via /praveentp/
    location /praveentp/ {
        proxy_pass http://backend:5000/praveentp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve static frontend files at /data-form/ with SPA fallback
    location /data-form/ {
        try_files $uri $uri/ /data-form/index.html;
    }
}
